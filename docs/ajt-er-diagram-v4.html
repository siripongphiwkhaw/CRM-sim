<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky toolbar over a scrollable drafting canvas; tables sit in left-to-right lanes
   (parents left, children right); a detail drawer opens beside the canvas. */
:root {
  --bg: #f3f5f8;
  --grid: #e3e8ef;
  --surface: #ffffff;
  --fg: #16202c;
  --muted: #5a6778;
  --line: #c3ccd8;
  --edge: #8794a6;
  --hot: #1d5fd1;
  --d-customer: #0b7a6e;
  --d-product: #b0560a;
  --d-shared: #6a3fc8;
  --tint-customer: #e3f3f0;
  --tint-product: #fbeee2;
  --tint-shared: #efe9fb;
  --d-bu: #b3263e;
  --tint-bu: #fbe6ea;
  --d-brand: #8a5a00;
  --tint-brand: #f8efd9;
  --obs: #0b7a6e;
  --inf: #b0560a;
  --font-display: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --grid: #18202a; --surface: #151c25; --fg: #e5ebf2; --muted: #95a3b5;
    --line: #2c3746; --edge: #5f6d80; --hot: #6ea2ff;
    --d-customer: #3cc9b4; --d-product: #f0a24a; --d-shared: #ab8cff;
    --tint-customer: #12302c; --tint-product: #352514; --tint-shared: #251d3d; --d-bu: #f2768c; --tint-bu: #3a1720; --d-brand: #e6b44f; --tint-brand: #33280f;
    --obs: #3cc9b4; --inf: #f0a24a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --grid: #18202a; --surface: #151c25; --fg: #e5ebf2; --muted: #95a3b5;
  --line: #2c3746; --edge: #5f6d80; --hot: #6ea2ff;
  --d-customer: #3cc9b4; --d-product: #f0a24a; --d-shared: #ab8cff;
  --tint-customer: #12302c; --tint-product: #352514; --tint-shared: #251d3d; --d-bu: #f2768c; --tint-bu: #3a1720; --d-brand: #e6b44f; --tint-brand: #33280f;
  --obs: #3cc9b4; --inf: #f0a24a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  display: flex; flex-direction: column;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

header.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 14px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.stats { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.tabs { display: flex; gap: 2px; }
.tab {
  border: 0; background: none; padding: 8px 12px 10px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 500; display: flex; align-items: center; gap: 8px;
}
.tab .sw { width: 9px; height: 9px; border-radius: 2px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 8px; }
.tools input[type="search"] {
  width: 200px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); font-family: var(--font-mono); font-size: 12px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.zoom { font-family: var(--font-mono); font-size: 12px; min-width: 3.5em; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: flex; }
.stage {
  flex: 1; min-width: 0; overflow: auto; position: relative;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.viewnote {
  position: sticky; left: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(4px); border-bottom: 1px solid var(--line); max-width: 100vw;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { overflow: visible; }
.sizer { position: relative; }
.canvas {
  position: absolute; left: 0; top: 0; z-index: 1; transform-origin: 0 0;
  display: flex; align-items: flex-start; gap: 110px; padding: 32px 40px 60px;
}
.lane { display: flex; flex-direction: column; gap: 26px; width: 300px; }
svg.edges { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); transition: opacity .15s, border-color .15s, box-shadow .15s;
}
.card.stub { border-style: dashed; }
.card-h {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px 5px 0 0;
  border-bottom: 1px solid var(--line); background: var(--tint);
}
.card-h .tn { font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: var(--dc); overflow-wrap: anywhere; }
.card-h .meta { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.card ul { list-style: none; margin: 0; padding: 3px 0; }
.card li {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 10px; align-items: center; gap: 6px;
  padding: 2px 10px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.45;
}
.card li .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.card li.pk .k { color: var(--fg); }
.card li .cn { overflow-wrap: anywhere; }
.card li.pk .cn { font-weight: 600; }
.card li .ct { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
.card li .ext { display: block; font-size: 10px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; justify-self: end; }
.dot.O { background: var(--obs); }
.dot.I { background: transparent; border: 1.5px solid var(--inf); }
.dot.C { background: var(--d-bu); border-radius: 1px; }
.d-customer { --dc: var(--d-customer); --tint: var(--tint-customer); }
.d-product { --dc: var(--d-product); --tint: var(--tint-product); }
.d-shared { --dc: var(--d-shared); --tint: var(--tint-shared); }
.d-bu { --dc: var(--d-bu); --tint: var(--tint-bu); }
.d-brand { --dc: var(--d-brand); --tint: var(--tint-brand); }
.d-stub { --dc: var(--muted); --tint: var(--bg); }
.card:hover { border-color: var(--edge); }
.has-sel .card { opacity: 0.28; }
.has-sel .card.rel { opacity: 1; }
.has-sel .card.sel { opacity: 1; border-color: var(--hot); box-shadow: 0 0 0 2px color-mix(in srgb, var(--hot) 30%, transparent); }
.card li.hot { background: color-mix(in srgb, var(--hot) 12%, transparent); }

.e path, .e line, .e circle { stroke: var(--edge); stroke-width: 1.3; fill: none; }
.e circle { fill: var(--surface); }
.e.opt > path.ln { stroke-dasharray: 5 4; }
.e.lk > path.ln { stroke-dasharray: 1.5 4; stroke-linecap: round; stroke-width: 1.6; }
.has-sel .e { opacity: 0.12; }
.has-sel .e.hot { opacity: 1; }
.e.hot path, .e.hot line, .e.hot circle { stroke: var(--hot); stroke-width: 1.8; }

aside.panel {
  width: 400px; max-width: 100%; flex: none; border-left: 1px solid var(--line); background: var(--surface);
  overflow: auto; padding-block: 18px 40px;
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.panel h2 { font-family: var(--font-mono); font-size: 17px; margin: 0 0 4px; color: var(--dc); overflow-wrap: anywhere; }
.panel .close { float: right; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted); }
.panel .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.dom { color: var(--dc); border-color: var(--dc); }
.panel p.note { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0 0 16px; max-width: 60ch; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
.cols { display: flex; flex-direction: column; }
.col { padding: 8px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.col .nm { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.col .ty { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.col .ds { grid-column: 1 / -1; font-family: "IBM Plex Sans Thai", var(--font-body); font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.col .fl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.flag { font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); }
.flag.pk { color: var(--fg); font-weight: 600; }
.flag.O { color: var(--obs); }
.flag.I { color: var(--inf); }
.flag.C { color: var(--d-bu); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--hot); cursor: pointer; font-family: var(--font-mono); font-size: 12px; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.reflist { display: flex; flex-direction: column; gap: 5px; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.55; }
.empty b { color: var(--fg); font-weight: 600; }

@media (max-width: 820px) {
  main { flex-direction: column; }
  aside.panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 45%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stats { margin-left: 0; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

const refsTo = {};
let fkCount = 0, obs = 0, inf = 0, clar = 0, lkCount = 0;
for (const [t, def] of Object.entries(DATA)) for (const c of def.cols) {
  if (c.tag === "O") obs++; else if (c.tag === "I") inf++; else if (c.tag === "C") clar++;
  if (c.lk) { lkCount++; (refsTo[c.lk.t] ||= []).push({ t, c: c.n, lk: true }); }
  if (c.fk) { fkCount++; (refsTo[c.fk.t] ||= []).push({ t, c: c.n }); }
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

$("stats").innerHTML =
  `<span><b>${Object.keys(DATA).length}</b> tables</span><span><b>${fkCount}</b> foreign keys</span>` +

const state = { view: "customer", keysOnly: false, sel: null, zoom: 1 };
try { const k = localStorage.getItem("er-keys"); if (k === "1") state.keysOnly = true; } catch (e) {}

function renderTabs() {
  $("tabs").innerHTML = Object.entries(VIEWS).map(([v, d]) =>
    `<button class="tab d-${d.dom}" role="tab" aria-selected="${v === state.view}" data-v="${v}"><i class="sw" style="background:var(--dc)"></i>${d.label}</button>`
  ).join("");
}

function renderCanvas() {
  const def = VIEWS[state.view];
  const inView = new Set(def.lanes.flat());
  $("viewtext").textContent = def.text;
  $("canvas").innerHTML = def.lanes.map(lane => `<div class="lane">${lane.map(t => card(t, inView)).join("")}</div>`).join("");
  $("mode-all").setAttribute("aria-pressed", String(!state.keysOnly));
  $("mode-keys").setAttribute("aria-pressed", String(state.keysOnly));
  requestAnimationFrame(() => { drawEdges(); applySel(); });
}

function card(t, inView) {
  const def = DATA[t];
  const cols = state.keysOnly ? def.cols.filter(c => c.pk || c.fk || c.lk) : def.cols;
  const rows = cols.map(c => {
    const k = c.pk && c.fk ? "PF" : c.pk ? "PK" : c.fk ? "FK" : c.lk ? "LJ" : "";
    const tgt = c.fk || c.lk;
    const ext = tgt && !inView.has(tgt.t) ? `<span class="ext">${c.lk ? "⇢" : "→"} ${esc(tgt.t)}</span>` : "";
    const title = [c.note, c.enum ? "values: " + c.enum.join(", ") : ""].filter(Boolean).join("\n");
    return `<li class="${c.pk ? "pk" : ""}" data-c="${c.n}" title="${esc(title)}"><span class="k">${k}</span>` +
      `<span class="cn">${esc(c.n)}${ext}</span><span class="ct">${esc(c.t)}</span>` +
      `<span class="dot ${c.tag || ""}"></span></li>`;
  }).join("");
  const hidden = def.cols.length - cols.length;
  return `<div class="card d-${domOf(t)}${STUBS.has(t) ? " stub" : ""}" data-t="${t}" tabindex="0" role="button" aria-label="Table ${t}">` +
    `<div class="card-h"><span class="tn">${t}</span><span class="meta">${STUBS.has(t) ? "stub · " : ""}${def.cols.length} cols${hidden ? ` · ${hidden} hidden` : ""}</span></div>` +
    `<ul>${rows}</ul></div>`;
}

function box(el) { return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; }

// Rows sit inside cards; with only .canvas positioned, offsetLeft/Top of cards and rows are canvas-relative.
function anchor(t, col) {
  const cardEl = $("canvas").querySelector(`.card[data-t="${t}"]`);
  if (!cardEl) return null;
  const b = box(cardEl);
  const row = col && cardEl.querySelector(`li[data-c="${col}"]`);
  const y = row ? row.offsetTop + row.offsetHeight / 2 : b.y + 16;
  return { x1: b.x, x2: b.x + b.w, y, cx: b.x + b.w / 2 };
}

function drawEdges() {
  const canvas = $("canvas"), svg = $("edges");
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const inView = new Set(VIEWS[state.view].lanes.flat());
  const parts = [];
  for (const t of inView) for (const c of DATA[t].cols) for (const kind of ["fk", "lk"]) {
    const ref = c[kind];
    if (!ref || !inView.has(ref.t)) continue;
    const ch = anchor(t, c.n), pa = anchor(ref.t, ref.c);
    if (!ch || !pa) continue;
    let sx, ex, sd, ed, d;
    if (ref.t === t || Math.abs(ch.cx - pa.cx) < 10) {
      sx = ch.x2; ex = pa.x2; sd = 1; ed = 1;
      const out = Math.max(sx, ex) + 34 + Math.abs(ch.y - pa.y) * 0.06;
      d = `M${sx} ${ch.y} C${out} ${ch.y} ${out} ${pa.y} ${ex} ${pa.y}`;
    } else {
      const childRight = ch.cx > pa.cx;
      sx = childRight ? ch.x1 : ch.x2; sd = childRight ? -1 : 1;
      ex = childRight ? pa.x2 : pa.x1; ed = childRight ? 1 : -1;
      const k = Math.max(40, Math.abs(ex - sx) * 0.45);
      d = `M${sx} ${ch.y} C${sx + sd * k} ${ch.y} ${ex + ed * k} ${pa.y} ${ex} ${pa.y}`;
    }
    if (kind === "lk") {
      parts.push(`<g class="e lk" data-a="${t}" data-b="${ref.t}" data-c="${c.n}"><path class="ln" d="${d}"/>${circ(sx, ch.y, sd, 5)}${circ(ex, pa.y, ed, 5)}</g>`);
      continue;
    }
    const one = (c.pk && !c.cpk) || c.uq;
    const childEnd = one ? bar(sx, ch.y, sd, 7) + bar(sx, ch.y, sd, 12) : crow(sx, ch.y, sd);
    const parentEnd = bar(ex, pa.y, ed, 7) + (c.nn ? bar(ex, pa.y, ed, 12) : circ(ex, pa.y, ed, 15));
    parts.push(`<g class="e${c.nn ? "" : " opt"}" data-a="${t}" data-b="${ref.t}" data-c="${c.n}"><path class="ln" d="${d}"/>${childEnd}${parentEnd}</g>`);
  }
  svg.innerHTML = parts.join("");
  sizeStage();
}
const bar = (x, y, dir, o) => `<line x1="${x + dir * o}" y1="${y - 6}" x2="${x + dir * o}" y2="${y + 6}"/>`;
const circ = (x, y, dir, o) => `<circle cx="${x + dir * o}" cy="${y}" r="3.6"/>`;
const crow = (x, y, dir) => `<path d="M${x} ${y - 7} L${x + dir * 12} ${y} L${x} ${y + 7} M${x} ${y} L${x + dir * 12} ${y}"/>` + bar(x, y, dir, 17);

function sizeStage() {
  const c = $("canvas");
  c.style.transform = `scale(${state.zoom})`;
  $("edges").style.transform = `scale(${state.zoom})`;
  $("edges").style.transformOrigin = "0 0";
  $("sizer").style.width = c.offsetWidth * state.zoom + "px";
  $("sizer").style.height = c.offsetHeight * state.zoom + "px";
  $("zlabel").textContent = Math.round(state.zoom * 100) + "%";
}

function select(t, scroll) {
  state.sel = t;
  applySel();
  renderPanel();
  if (scroll && t) {
    const el = $("canvas").querySelector(`.card[data-t="${t}"]`);
    if (el) {
      const st = $("stage");
      st.scrollTo({ left: Math.max(0, el.offsetLeft * state.zoom - 60), top: Math.max(0, el.offsetTop * state.zoom - 80), behavior: "smooth" });
    }
  }
}

function applySel() {
  const stage = $("stage"), t = state.sel;
  stage.classList.toggle("has-sel", !!t && !!$("canvas").querySelector(`.card[data-t="${t}"]`));
  const rel = new Set(t ? [t] : []);
  $("edges").querySelectorAll(".e").forEach(g => {
    const hot = t && (g.dataset.a === t || g.dataset.b === t);
    g.classList.toggle("hot", !!hot);
    if (hot) { rel.add(g.dataset.a); rel.add(g.dataset.b); }
  });
  $("canvas").querySelectorAll(".card").forEach(el => {
    el.classList.toggle("sel", el.dataset.t === t);
    el.classList.toggle("rel", rel.has(el.dataset.t));
  });
  $("canvas").querySelectorAll("li.hot").forEach(li => li.classList.remove("hot"));
  if (t) $("edges").querySelectorAll(".e.hot").forEach(g => {
    const li = $("canvas").querySelector(`.card[data-t="${g.dataset.a}"] li[data-c="${g.dataset.c}"]`);
    if (li) li.classList.add("hot");
  });
}

function goTo(t) {
  const inCurrent = VIEWS[state.view].lanes.flat().includes(t);
  if (!inCurrent) { state.view = homeView[t]; renderTabs(); renderCanvas(); setHash(); }
  requestAnimationFrame(() => requestAnimationFrame(() => select(t, true)));
}

function renderPanel() {
  const p = $("panel"), t = state.sel;
  if (!t) {
    p.className = "panel";
    p.innerHTML = `<p class="empty"><b>Select a table</b> to see every column with its type, keys, allowed values and the Thai screen label it came from.</p>
      <p class="empty">Lines run from a foreign key to the key it points at. A key that points outside the current view shows as <span style="font-family:var(--font-mono)">→ table</span> under the column name.</p>
      <p class="empty">Source: docs/ajt-design-data-model-v4.md (revision 4: sub-brands sit under BU; BU rules kept by the CRM team, approved by AJT). Prototype crawled 14 Nov 2026. Rebuild with scripts/er/gen_er.py and er_template_v4.html.</p>`;
    return;
  }
  const def = DATA[t];
  const by = refsTo[t] || [];
  p.className = `panel d-${domOf(t)}`;
  p.innerHTML =
    `<button class="close" type="button" id="pclose">Close</button><h2>${t}</h2>` +
    `<div class="badges"><span class="pill dom">${STUBS.has(t) ? "stub, outside scope" : VIEWS[homeView[t]].label}</span>` +
    `<span class="pill">${def.cols.length} columns</span><span class="pill">${by.length} incoming links</span></div>` +
    (def.note ? `<p class="note">${esc(def.note)}</p>` : "") +
    `<h3>Columns</h3><div class="cols">` + def.cols.map(c => {
      const flags = [
        c.pk ? `<span class="flag pk">PK</span>` : "",
        c.fk ? `<span class="flag">FK${c.fkCols ? " (" + c.fkCols.map(esc).join(", ") + ")" : ""} → <button class="linkbtn" data-go="${c.fk.t}">${esc(c.fk.t)}</button>.${esc(c.fk.c)}</span>` : "",
        c.lk ? `<span class="flag">joins ⇢ <button class="linkbtn" data-go="${c.lk.t}">${esc(c.lk.t)}</button>.${esc(c.lk.c)} (no FK)</span>` : "",
        c.nn ? `<span class="flag">NOT NULL</span>` : `<span class="flag">nullable</span>`,
        c.uq ? `<span class="flag">UNIQUE</span>` : "",
        c.tag === "O" ? `<span class="flag O">seen on screen</span>` : c.tag === "I" ? `<span class="flag I">inferred</span>` : c.tag === "C" ? `<span class="flag C">AJT clarification</span>` : ""
      ].join("");
      const en = c.enum ? `<div class="ds">Allowed: ${c.enum.map(esc).join(" · ")}</div>` : "";
      return `<div class="col"><span class="nm">${esc(c.n)}</span><span class="ty">${esc(c.t)}</span>` +
        `<div class="fl">${flags}</div>${c.note ? `<div class="ds">${esc(c.note)}</div>` : ""}${en}</div>`;
    }).join("") + `</div>` +
    `<h3>Referenced by</h3>` + (by.length
      ? `<div class="reflist">${by.map(r => `<button class="linkbtn" data-go="${r.t}">${r.t}.${r.c}${r.lk ? " (logical)" : ""}</button>`).join("")}</div>`
      : `<p class="empty">No table points at this one.</p>`);
}

// events
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.view = b.dataset.v; renderTabs(); renderCanvas(); setHash();
});
$("canvas").addEventListener("click", e => {
  const c = e.target.closest(".card");
  e.stopPropagation();
  select(c ? (state.sel === c.dataset.t ? null : c.dataset.t) : null);
});
$("canvas").addEventListener("keydown", e => {
  const c = e.target.closest(".card");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(c.dataset.t); }
});
$("stage").addEventListener("click", e => { if (!e.target.closest(".card") && !e.target.closest(".viewnote")) select(null); });
$("panel").addEventListener("click", e => {
  if (e.target.id === "pclose") return select(null);
  const g = e.target.closest("[data-go]"); if (g) goTo(g.dataset.go);
});
$("find").addEventListener("change", e => {
  const v = e.target.value.trim().toLowerCase();
  const t = Object.keys(DATA).find(n => n === v) || Object.keys(DATA).find(n => n.includes(v));
  if (t) { goTo(t); e.target.value = ""; }
});
function setMode(k) {
  state.keysOnly = k;
  try { localStorage.setItem("er-keys", k ? "1" : "0"); } catch (e) {}
  renderCanvas();
}
$("mode-all").addEventListener("click", () => setMode(false));
$("mode-keys").addEventListener("click", () => setMode(true));
const setZoom = z => { state.zoom = Math.min(1.6, Math.max(0.3, Math.round(z * 100) / 100)); sizeStage(); };
$("zin").addEventListener("click", () => setZoom(state.zoom + 0.1));
$("zout").addEventListener("click", () => setZoom(state.zoom - 0.1));
$("zfit").addEventListener("click", () => setZoom(($("stage").clientWidth - 8) / $("canvas").offsetWidth));

function setHash() { try { history.replaceState(null, "", "#" + state.view); } catch (e) { location.hash = state.view; } }
function readHash() { const h = location.hash.slice(1); if (VIEWS[h]) state.view = h; }
window.addEventListener("hashchange", () => { readHash(); renderTabs(); renderCanvas(); });

readHash();
renderTabs();
renderCanvas();
renderPanel();
if (window.innerWidth < 820) setZoom(0.6);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawEdges(); applySel(); });
</script>
